services:
  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file: .env
    expose:
      - '3000'
    read_only: true
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=32m
      - /run:mode=0755,noexec,nosuid,nodev,size=8m
    volumes:
      - notifier-data:/var/lib/webhook-noti
    restart: unless-stopped

volumes:
  notifier-data: