services:
  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      ALLOWED_REPOSITORIES: ${ALLOWED_REPOSITORIES:?Set ALLOWED_REPOSITORIES in .env}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID in .env}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - github_app_private_key
      - github_webhook_secret
      - discord_bot_token
      - telegram_bot_token
    expose:
      - '3000'
    read_only: true
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=32m
      - /run:mode=0755,noexec,nosuid,nodev,size=8m
    volumes:
      - notifier-data:/var/lib/webhook-noti
    restart: unless-stopped

volumes:
  notifier-data:

secrets:
  github_app_private_key:
    file: ./secrets/github_app_private_key
  github_webhook_secret:
    file: ./secrets/github_webhook_secret
  discord_bot_token:
    file: ./secrets/discord_bot_token
  telegram_bot_token:
    file: ./secrets/telegram_bot_token